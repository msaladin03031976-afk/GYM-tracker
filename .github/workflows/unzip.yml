name: Unzip project
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          if [ ! -f gym-tracker.zip ]; then echo "Nothing to unzip"; exit 0; fi
          unzip -o -q gym-tracker.zip -d _tmp
          cp -r _tmp/gym-tracker/. .
          rm -rf _tmp gym-tracker.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project files"
          git push
